# 英文标题 → 中文标题 映射表
#
# 用途：同步脚本用它把上游 Jekyll 站点的 title 换成中文，
# 同时把 parent / grand_parent 一并替换，从而保证导航层级与英文版完全一致。
#
# 约定：
#   - 键必须是上游 front matter 里 `title:` 的原文（区分大小写，逐字一致）
#   - 术语对照遵循 docs 内的《术语表》：MHD 相关保留英文缩写
#   - 新增上游页面后，缺译的标题会由 tools/sync_upstream.py 报告

