title: JOREK 中文文档
description: JOREK 非线性扩展 MHD 代码文档的社区中文译本（非官方，仅供学习交流）
theme: just-the-docs

url: "https://panchengn.github.io"
baseurl: "/jorek-docs-zh"

search_enabled: true

# Default color scheme (custom, defined in _sass/color_schemes/).
# A runtime dark/light toggle switches between "jorek_light" and "gruvbox_dark"
# (see _includes/header_custom.html and _includes/head_custom.html).
color_scheme: jorek_light

heading_anchors: true

markdown: kramdown
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    mdash: "---"
    ndash: "--"

footer_content: "非官方社区译本，仅供学习交流 · 原文版权归 JOREK 团队所有 · LGPL-3.0"

aux_links:
  "JOREK Website":
    - "https://www.jorek.eu"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "返回顶部"

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
# ===== 中文站附加配置 =====
lang: zh-CN
exclude:
  - tools
  - i18n
  - .venv
  - Gemfile
  - Gemfile.lock
  - README.md
  - MAINTAINING.md
  - TRANSLATING.md
  - _site
  - .git
